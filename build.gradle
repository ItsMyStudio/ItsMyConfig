allprojects {
    group = "to.itsme"
    version = "5.0.0"
    description = "ItsMyConfig"

    ext {
        kyoriVersion = "5.0.1"
        kyoriPlatformVersion = "1.0.1"

        kyori = { String module ->
            return "net.kyori:adventure-" + module + ":" + kyoriVersion
        }

        kyoriPlatform = { String module ->
            return "studio.mevera.adventure:adventure-" + module + ":" + kyoriPlatformVersion
        }

        KyoriModule = [
                API                   : "api",
                BUKKIT                : "platform-bukkit",
                BUNGEE                : "platform-bungeecord",
                SPONGE                : "platform-spongeapi",
                MINI_MESSAGE          : "text-minimessage",
                GSON_SERIALIZER       : "text-serializer-gson",
                PLAIN_SERIALIZER      : "text-serializer-plain",
                LEGACY_SERIALIZER     : "text-serializer-legacy",
                BUNGEE_SERIALIZER     : "text-serializer-bungeecord",
                LEGACY_SERIALIZER_IMPL: "text-serializer-json-legacy-impl"
        ]
    }
}
