plugins {
    id 'java'
    id "me.champeau.jmh" version "0.7.3"
    id "net.kyori.blossom" version "2.1.0"
    id "com.gradleup.shadow" version "9.0.1"
    id "org.jetbrains.gradle.plugin.idea-ext" version "1.1.9"
}

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        name = "central-snapshots"
        url = "https://central.sonatype.com/repository/maven-snapshots/"
    }
    maven {
        name = "codemc"
        url = "https://repo.codemc.io/repository/maven-releases/"
    }
    maven {
        name = "codemc-snapshots"
        url = "https://repo.codemc.io/repository/maven-snapshots/"
    }
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
    maven {
        name = "libby-repo"
        url = "https://repo.alessiodp.com/snapshots"
    }
    maven {
        name = "helpchat-repo"
        url = "https://repo.helpch.at/releases"
    }
    maven {
        name = "redempt.dev"
        url = "https://redempt.dev"
    }
    maven {
        name = "jitpack"
        url = "https://jitpack.io"
    }
    maven {
        name = "gravemc"
        url = "https://repo.gravemc.net/releases/"
    }
}

def imperatVersion = "4.0.0-SNAPSHOT"
dependencies {
    // api ->
    implementation project(":api")

    //adventure ->
    implementation "${kyori(KyoriModule.MINI_MESSAGE)}"
    implementation "${kyori(KyoriModule.GSON_SERIALIZER)}"
    implementation "${kyori(KyoriModule.PLAIN_SERIALIZER)}"
    implementation "${kyori(KyoriModule.LEGACY_SERIALIZER)}"
    implementation "${kyori(KyoriModule.LEGACY_SERIALIZER_IMPL)}"

    implementation "${kyoriPlatform(KyoriModule.BUKKIT)}"
    implementation "${kyoriPlatform(KyoriModule.BUNGEE_SERIALIZER)}"

    // imperat ->
    implementation "studio.mevera:imperat-core:${imperatVersion}"
    implementation "studio.mevera:imperat-bukkit:${imperatVersion}"

    // imperat ->
    implementation "dev.dejvokep:boosted-yaml-imc:1.3.7"
    implementation "dev.dejvokep:boosted-yaml-spigot:1.5"

    // other ->
    implementation "org.bstats:bstats-bukkit:3.0.2"
    implementation "com.github.Redempt:Crunch:2.0.3"
    implementation "com.github.technicallycoded:FoliaLib:0.4.3"
    implementation "com.alessiodp.libby:libby-bukkit:2.0.0-SNAPSHOT"
    implementation "com.github.retrooper:packetevents-spigot:2.13.0"

    compileOnly "io.papermc.paper:paper-api:1.20.4-R0.1-SNAPSHOT"
    compileOnly "org.apache.logging.log4j:log4j-core:2.17.1"
    compileOnly "net.dmulloy2:ProtocolLib:5.4.0"
    compileOnly "me.clip:placeholderapi:2.11.6"

    testImplementation("io.papermc.paper:paper-api:1.20.4-R0.1-SNAPSHOT")
    testImplementation("${kyori(KyoriModule.MINI_MESSAGE)}")

    testImplementation(platform('org.junit:junit-bom:5.13.4'))
    testImplementation('org.junit.jupiter:junit-jupiter')
    testRuntimeOnly('org.junit.platform:junit-platform-launcher')
}

tasks.withType(JavaCompile).configureEach {
    sourceCompatibility = '21'
    targetCompatibility = '21'
    options.encoding = "UTF-8"
    options.compilerArgs += ["-parameters"]
}

tasks.named('shadowJar') {
    dependsOn tasks.named('test')
}

test {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
    }
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}

def shadePath = "to.itsme.itsmyconfig.shade."
shadowJar {
    manifest {
        attributes("paperweight-mappings-namespace": "mojang")
    }
    relocate("net.kyori", "${shadePath}kyori")
    relocate("org.bstats", "${shadePath}bstats")
    relocate("redempt.crunch", "${shadePath}crunch")
    relocate("com.alessiodp.libby", "${shadePath}libby")
    relocate("com.tcoded.folialib", "${shadePath}folialib")
    relocate("studio.mevera.imperat", "${shadePath}imperat")
    relocate("dev.dejvokep.boostedyaml", "${shadePath}boostedyaml")
    relocate("com.github.retrooper.packetevents", "${shadePath}packetevents")
    relocate("io.github.retrooper.packetevents", "${shadePath}iopacketevents")

    // rename outcome jar
    archiveFileName = "ItsMyConfig-${project.version}.jar"
}

sourceSets {
    main {
        blossom {
            javaSources {
                property("shadePath", shadePath)
                property("adventureVersion", kyoriVersion)
                property("adventurePlatformVersion", kyoriPlatformVersion)
            }
        }
    }
}

jmh {
    fork = 0
    warmup = '1s'
    warmupIterations = 2
    timeOnIteration = '3s'
}
