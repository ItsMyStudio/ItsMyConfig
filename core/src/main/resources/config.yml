# Enable debug mode. This will enable debug logging and other debug features.
debug: false

# The symbol prefix to use for the config.
# This is used to identify the config symbols in the code (e.g. $message).
# Note: You can also use tags directly like <sc:success> without needing this prefix!
symbol-prefix: $

# If true, all console messages will be translated using the translation system.
# This includes messages from the plugin as well as messages from other plugins.
translate-console: false

listeners:
  PacketEvents:
    priority: 1

messages:
  invalid-use:
    - "<red><bold>ERROR</bold></red> <white>┃ Invalid use"
    - "  <yellow>/<usage>"
  reload:
    - "<green><bold>SUCCESS</bold></green> <white>┃ SeriaPrefix reloaded !"
  no-permission:
    - "<red><bold>ERROR</bold></red> <white>┃ You don't have permission"
  message-sent:
    - "<green><bold>SUCCESS</bold></green> <white>┃ Message Sent !"

formatting:
  thousands: k
  millions: M
  billions: B
  trillions: T
  quadrillions: Q
