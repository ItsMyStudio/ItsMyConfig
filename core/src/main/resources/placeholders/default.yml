# You can modify this file to change most of the configurations I sell.
# Refer to the placeholders/example.yml file for more examples.
# For the MiniMessage format, check the documentation here: https://docs.papermc.io/adventure/minimessage/format/.
# For the plugin documentation, visit: https://itsmy.studio/docs/itsmyconfig.
# For support, join our Discord: https://itsmy.studio/discord.

# To find all configurations compatible with ItsMyConfig, which adapt directly to the style you have defined,
# visit: https://builtbybit.com/itsmyconfig-bundle

# We also created on the documentation a live editor where you can test and create your own theme presets, visit: https://itsmy.studio/docs/itsmyconfig/editor

custom-placeholder:
  # colored_text only supports MiniMessage and custom tags like SmallCaps or Placeholder (p)
  server-name:
    value: "<gradient:#ff0f7b:#f89b29><b>ServerName</b></gradient>"
    type: colored_text
  
  # Use MiniMessage here too 
  prefix:
    value: "<gradient:#ff0f7b:#f89b29><b>ServerName</b></gradient> <p:text-color>┃"
  error-prefix:
    value: "<red><b>Error</b></red> <p:text-color>┃"
    
  # Can be #RRGGBB or color names: black, dark_blue, dark_green, dark_aqua, dark_red, dark_purple, gold, gray, dark_gray, blue, green, aqua, red, light_purple, yellow, or white.
  primary-color:
    value: "yellow"
    type: color
    bold: false
  secondary-color:
    value: "gold"
    type: color
  text-color:
    value: "white"
    type: color
  dark-color:
    value: "gray"
    type: color
  darkest-color:
    value: "dark_gray"
    type: color
    
  # Just put the link without https://
  discord:
    value: "discord.gg/example"
  store:
    value: "store.servername.net"
  ip:
    value: "play.servername.net"
  
  # Use MiniMessage here too, {0} refers to the amount
  exp-format:
    value: "<#F15BB5>{0}◎</#F15BB5>"
    type: colored_text
  eco-format:
    value: "<yellow>{0}⛁</yellow>"
    type: colored_text
